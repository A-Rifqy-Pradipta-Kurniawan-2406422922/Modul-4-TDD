<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h3>Pay Order</h3>

    <div class="mb-3">
        <strong>Order ID:</strong>
        <span th:text="${order.id}"></span>
    </div>

    <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
        <button type="submit" class="btn btn-primary">Proceed Payment</button>
    </form>

    <a th:href="@{/order/history}" class="btn btn-link mt-3">Back to History</a>
</div>
</body>
</html>
