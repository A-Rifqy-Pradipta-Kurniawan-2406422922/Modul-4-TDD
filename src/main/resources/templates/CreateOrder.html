<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h3>Create Order</h3>

    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="authorInput">Author</label>
            <input type="text" class="form-control col-4" id="authorInput" name="author" placeholder="Input author name" required>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
    </form>

    <a th:href="@{/order/history}" class="btn btn-link mt-3">Go to Order History</a>
</div>
</body>
</html>
