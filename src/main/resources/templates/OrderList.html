<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
    <h3>Order List</h3>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Author</th>
            <th>Status</th>
            <th>Order Time</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.author}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.orderTime}"></td>
            <td>
                <a th:href="@{/order/pay/{orderId}(orderId=${order.id})}" class="btn btn-sm btn-info">Pay</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/order/history}" class="btn btn-link">Back</a>
</div>
</body>
</html>
