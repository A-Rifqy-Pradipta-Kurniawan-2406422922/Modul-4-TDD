<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Admin List</title>
</head>
<body>
<h3 id="paymentAdminListTitle">Payment Admin List</h3>
<table>
    <tbody>
    <tr th:each="payment : ${payments}">
        <td th:text="${payment.id}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(payments)}">
        <td>no payment data</td>
    </tr>
    </tbody>
</table>
</body>
</html>
